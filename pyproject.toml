[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project]
name = "scanwell"
version = "2.0.0"
description = "Cross-platform sensitive data scanner for local host devices"
requires-python = ">=3.9"
dependencies = [
    "python-magic>=0.4.27; platform_system != 'Windows'",
    "python-docx>=1.0.0",
    "pdfplumber>=0.10.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "psutil>=5.9.0",
    "python-Levenshtein>=0.23.0",
    "yara-python>=4.3.0",
]

[project.scripts]
scanwell = "src.cli:main"
